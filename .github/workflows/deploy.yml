name: Deploy

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

# GITHUB_TOKEN defaults to read-only for packages, so the docker push to
# ghcr.io failed with a 403 on every run even though the image built fine.
# packages:write lets the login-action token push; contents:read is the
# minimum the checkout needs. Nothing else is granted.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "tag=staging-${GITHUB_SHA}" >> $GITHUB_OUTPUT
          fi
      - run: docker build -t ghcr.io/tahk88-png/voucher-platform:${{ steps.meta.outputs.tag }} .
      - run: docker push ghcr.io/tahk88-png/voucher-platform:${{ steps.meta.outputs.tag }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            APP_DIR=${{ secrets.DEPLOY_APP_DIR }}
            cd ${APP_DIR}
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            PREV_TAG_FILE=.deploy_prev_tag
            if [ -f "${PREV_TAG_FILE}" ]; then
              PREV_TAG=$(cat ${PREV_TAG_FILE})
            else
              PREV_TAG=latest
            fi
            echo ${IMAGE_TAG} > ${PREV_TAG_FILE}
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              COMPOSE_FILE=docker-compose.prod.yml
              HEALTH_PORT=3000
            else
              COMPOSE_FILE=docker-compose.staging.yml
              HEALTH_PORT=3001
            fi
            docker compose -f ${COMPOSE_FILE} pull
            docker compose -f ${COMPOSE_FILE} up -d migrate
            docker compose -f ${COMPOSE_FILE} up -d app
            sleep 5
            if ! curl -fsS http://localhost:${HEALTH_PORT}/api/health > /dev/null; then
              echo "Healthcheck failed, rolling back..."
              echo ${PREV_TAG} > ${PREV_TAG_FILE}
              export IMAGE_TAG=${PREV_TAG}
              docker compose -f ${COMPOSE_FILE} up -d app
              exit 1
            fi
