name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prisma client must exist before tsc can resolve @prisma/client types.
      - run: pnpm exec prisma generate
      - run: pnpm exec tsc --noEmit --skipLibCheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      # Runs the default Vitest pool (forks, single-fork) with coverage.
      # Integration tests that need a live Postgres are opt-in via
      # VITEST_INCLUDE_INTEGRATION — see vitest.config.ts.
      - run: pnpm run test:coverage
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - name: Build
        # instrumentation.ts runs validateEnv() during the build, so the build
        # needs these present. They are throwaway build-time placeholders — the
        # server still validates the real values at startup, which is where the
        # fail-fast check actually protects a deployment.
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/build_placeholder"
          AUTH_SECRET: "ci-build-placeholder-secret-not-used-at-runtime"
        run: |
          set -o pipefail
          if ! pnpm run build:next 2>&1 | tee /tmp/build.log; then
            echo "::group::full build log"
            cat /tmp/build.log
            echo "::endgroup::"
            # Surface the failure as annotations (logs need admin rights to
            # download). Pull the lines that actually describe the error rather
            # than a blind tail, which the long OpenTelemetry warning trace
            # would otherwise fill.
            grep -nE "Type error|error TS|Failed to compile|Module not found|Cannot find|SyntaxError|ReferenceError|TypeError:|Error:" /tmp/build.log \
              | grep -viE "opentelemetry|@sentry|Critical dependency|Import trace|PackFileCacheStrategy" \
              | head -20 \
              | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
            exit 1
          fi

  schema-drift:
    # Fails the build if prisma/schema.prisma has changed in a way that
    # would require a new migration but none was added. Keeps deploy
    # migrations deterministic.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check migrations match schema
        # `migrate diff` with equal from/to exits 0 (no drift) or 2 (drift).
        # We compare the applied migrations (`--from-migrations`) against
        # the current schema (`--to-schema-datamodel`). Non-zero = drift.
        run: |
          pnpm exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "postgresql://postgres:postgres@localhost:5432/shadow" \
            --exit-code || (echo "::error::Schema drift — add a migration for your schema changes"; exit 1)
        env:
          # migrate diff without shadow DB only works for sqlite; we spin up
          # a throwaway Postgres via services below.
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shadow"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          # Without this the service only creates the default `postgres`
          # database, so every connection to .../shadow above failed and the
          # drift check could never actually run.
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  # Integration tests that hit a real Postgres via Prisma. Gated behind
  # VITEST_INCLUDE_INTEGRATION so the default `test` job stays fast and
  # doesn't need a DB service. Runs in parallel with `test`.
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to test DB
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/voucher_test"
      - name: Run integration tests
        run: pnpm run test:integration
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/voucher_test"
          VITEST_INCLUDE_INTEGRATION: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voucher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Docker build
        run: |
          set -o pipefail
          # --load: the buildx builder otherwise keeps the image in its own
          # cache, and the smoke test below runs it from the local daemon.
          if ! docker build --load --progress=plain -t voucher-platform:ci . 2>&1 | tee /tmp/docker.log; then
            # Surface the failure as annotations — job logs need repository
            # admin rights to download.
            grep -nE "^#[0-9]+ [0-9.]+ .*(ERR|error|Error|failed|not found|Cannot)|^ERROR:|npm error|pnpm.*ERR" /tmp/docker.log \
              | tail -20 \
              | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
            exit 1
          fi
      - name: Smoke-test the image
        # An image that builds cleanly can still be unable to run: Prisma
        # engines that cannot load (every query fails), or a wrong root layout
        # (every page redirects in a loop). Run it the way a server does:
        # migrations against an empty Postgres (the entrypoint runs them, as
        # MIGRATE_ON_START defaults to true), then require the health endpoint
        # AND real pages to answer 200 without following redirects.
        run: |
          docker network create smoke
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_USER=voucher -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=voucher \
            postgres:16-alpine
          # Over TCP: during first-start initialisation Postgres only listens
          # on its socket, so this passes once the real server is up.
          for _ in $(seq 1 30); do
            docker exec smoke-db pg_isready -h 127.0.0.1 -U voucher -d voucher >/dev/null 2>&1 && break
            sleep 2
          done
          docker run -d --name smoke-app --network smoke -p 127.0.0.1:3000:3000 \
            -e DATABASE_URL=postgresql://voucher:smoke@smoke-db:5432/voucher \
            -e AUTH_SECRET=ci-smoke-test-only-0123456789abcdef0123456789abcdef \
            -e AUTH_TRUST_HOST=true \
            -e NEXT_PUBLIC_APP_URL=http://localhost:3000 \
            -e NEXTAUTH_URL=http://localhost:3000 \
            voucher-platform:ci
          for _ in $(seq 1 60); do
            curl -fs -o /dev/null --max-time 5 http://127.0.0.1:3000/api/health && break
            sleep 3
          done
          failed=""
          for path in /api/health / /login /contact /robots.txt; do
            # A refused or timed-out request prints 000; `|| true` keeps bash -e
            # from aborting before the log below is shown.
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "http://127.0.0.1:3000$path") || true
            echo "$path -> HTTP $code"
            [ "$code" = 200 ] || failed="$failed $path=$code"
          done
          if [ -n "$failed" ]; then
            echo "::group::app container log"
            docker logs --tail 200 smoke-app 2>&1
            echo "::endgroup::"
            echo "::error::image smoke test failed (expected HTTP 200):$failed"
            exit 1
          fi
