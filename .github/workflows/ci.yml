name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prisma client must exist before tsc can resolve @prisma/client types.
      - run: pnpm exec prisma generate
      - run: pnpm exec tsc --noEmit --skipLibCheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      # Runs the default Vitest pool (forks, single-fork) with coverage.
      # Integration tests that need a live Postgres are opt-in via
      # VITEST_INCLUDE_INTEGRATION — see vitest.config.ts.
      - run: pnpm run test:coverage
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm run build:next
        # instrumentation.ts runs validateEnv() during the build, so the build
        # needs these present. They are throwaway build-time placeholders — the
        # server still validates the real values at startup, which is where the
        # fail-fast check actually protects a deployment.
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/build_placeholder"
          AUTH_SECRET: "ci-build-placeholder-secret-not-used-at-runtime"

  schema-drift:
    # Fails the build if prisma/schema.prisma has changed in a way that
    # would require a new migration but none was added. Keeps deploy
    # migrations deterministic.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check migrations match schema
        # `migrate diff` with equal from/to exits 0 (no drift) or 2 (drift).
        # We compare the applied migrations (`--from-migrations`) against
        # the current schema (`--to-schema-datamodel`). Non-zero = drift.
        run: |
          pnpm exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "postgresql://postgres:postgres@localhost:5432/shadow" \
            --exit-code || (echo "::error::Schema drift — add a migration for your schema changes"; exit 1)
        env:
          # migrate diff without shadow DB only works for sqlite; we spin up
          # a throwaway Postgres via services below.
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shadow"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  # Integration tests that hit a real Postgres via Prisma. Gated behind
  # VITEST_INCLUDE_INTEGRATION so the default `test` job stays fast and
  # doesn't need a DB service. Runs in parallel with `test`.
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to test DB
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/voucher_test"
      - name: Run integration tests
        run: pnpm run test:integration
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/voucher_test"
          VITEST_INCLUDE_INTEGRATION: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voucher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t voucher-platform:ci .
