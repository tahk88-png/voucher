<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - GiftHub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #faf8f5;
      color: #2D2721;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container { max-width: 480px; text-align: center; }
    .logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #FFC857, #FFB627);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 4px 12px rgba(255, 182, 39, 0.3);
    }
    .logo svg { width: 32px; height: 32px; fill: #2D2721; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { color: #6b5e52; margin-bottom: 32px; line-height: 1.5; }
    .voucher-list {
      text-align: left;
      background: white;
      border-radius: 12px;
      border: 1px solid #e8e0d8;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .voucher-list-header {
      padding: 12px 16px;
      font-weight: 600;
      font-size: 14px;
      background: #f5f0eb;
      border-bottom: 1px solid #e8e0d8;
    }
    .voucher-item {
      padding: 12px 16px;
      border-bottom: 1px solid #f0ebe5;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .voucher-item:last-child { border-bottom: none; }
    .voucher-name { font-weight: 500; font-size: 14px; }
    .voucher-value { color: #b8860b; font-weight: 600; font-size: 14px; }
    .empty { padding: 24px 16px; text-align: center; color: #9a8d80; font-size: 14px; }
    .retry-btn {
      background: linear-gradient(135deg, #FFC857, #FFB627);
      color: #2D2721;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(255, 182, 39, 0.3);
    }
    .retry-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a3 3 0 0 0-3-3c-1.05 0-1.95.56-2.5 1.38L12 4l-.5-.62A2.988 2.988 0 0 0 9 2 3 3 0 0 0 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/></svg>
    </div>
    <h1>You're Offline</h1>
    <p class="subtitle">No internet connection. Your cached vouchers are available below.</p>

    <div class="voucher-list" id="voucher-list">
      <div class="voucher-list-header">Cached Vouchers</div>
      <div class="empty" id="voucher-empty">Loading cached data...</div>
    </div>

    <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
  </div>

  <script>
    (function() {
      var DB_NAME = 'gifthub-offline';
      var DB_VERSION = 1;
      var STORE_NAME = 'vouchers';

      function openDB() {
        return new Promise(function(resolve, reject) {
          var req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME, { keyPath: 'id' });
            }
          };
          req.onsuccess = function(e) { resolve(e.target.result); };
          req.onerror = function() { reject(req.error); };
        });
      }

      function getAll(db) {
        return new Promise(function(resolve, reject) {
          var tx = db.transaction(STORE_NAME, 'readonly');
          var store = tx.objectStore(STORE_NAME);
          var req = store.getAll();
          req.onsuccess = function() { resolve(req.result); };
          req.onerror = function() { reject(req.error); };
        });
      }

      openDB().then(function(db) {
        return getAll(db);
      }).then(function(vouchers) {
        var container = document.getElementById('voucher-list');
        var empty = document.getElementById('voucher-empty');
        if (!vouchers || vouchers.length === 0) {
          empty.textContent = 'No cached vouchers available.';
          return;
        }
        empty.remove();
        vouchers.forEach(function(v) {
          var item = document.createElement('div');
          item.className = 'voucher-item';
          item.innerHTML = '<span class="voucher-name">' + (v.name || v.code || v.id) + '</span>' +
            '<span class="voucher-value">' + (v.displayValue || '') + '</span>';
          container.appendChild(item);
        });
      }).catch(function() {
        var empty = document.getElementById('voucher-empty');
        if (empty) empty.textContent = 'No cached vouchers available.';
      });
    })();
  </script>
</body>
</html>
