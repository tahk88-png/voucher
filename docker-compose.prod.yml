# Production stack for a shared Docker host. See DEPLOYMENT.md.
#
# Run it through deploy/compose.sh (or deploy/deploy.sh), which passes the
# right files and image tag:
#   sh deploy/compose.sh production ps
# By hand, the env file must be given for ${...} interpolation as well:
#   IMAGE_TAG=v1.2.3 docker compose --env-file env/.env.production -f docker-compose.prod.yml ps
# env/.env.production is the single source: it feeds the interpolation below
# and is the containers' environment (env_file).
#
# Only the app is published, and only on 127.0.0.1 — host nginx proxies to it.
# Postgres and Redis have no host ports at all: Docker's port publishing
# bypasses ufw/iptables, so any published port would be open to the internet.
# Inside the stack they are reached by service name (postgres:5432, redis:6379).
#
# The project name keeps containers, volumes and the network separate from the
# staging stack even when both run from the same directory on one host.
name: voucher-prod

# Docker keeps container logs forever by default; cap them so this stack cannot
# fill the disk the other sites on the host share.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Memory limits: sized for a shared VPS (e.g. 8–16 GB running ~10 sites). The
# whole stack is capped at ~1.8 GB so a leak or runaway query here is OOM-killed
# and restarted inside its own limit instead of starving neighbouring sites.
# Next.js serves this app in ~300–600 MB; Postgres at default settings
# (shared_buffers=128MB) fits in 512 MB; Redis only holds TTL'd cache and
# rate-limit keys. Override in env/.env.production if the host has more room.

services:
  app:
    image: ghcr.io/tahk88-png/voucher-platform:${IMAGE_TAG:?IMAGE_TAG is not set - use deploy/compose.sh or export IMAGE_TAG}
    container_name: voucher-app
    restart: unless-stopped
    # tini as PID 1: forwards docker stop's SIGTERM and reaps zombies.
    init: true
    env_file:
      - env/.env.production
    environment:
      NODE_ENV: production
      SENTRY_ENVIRONMENT: production
      PORT: 3000
      # deploy/deploy.sh runs the migrate service to completion before it
      # replaces the app, so the app itself never touches the schema (and a
      # rolled-back image starts without running anything against the DB).
      MIGRATE_ON_START: "false"
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    mem_limit: ${APP_MEM_LIMIT:-1g}
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrate:
    image: ghcr.io/tahk88-png/voucher-platform:${IMAGE_TAG:?IMAGE_TAG is not set - use deploy/compose.sh or export IMAGE_TAG}
    container_name: voucher-migrate
    env_file:
      - env/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    mem_limit: ${APP_MEM_LIMIT:-1g}
    logging: *logging

  postgres:
    image: postgres:16-alpine
    container_name: voucher-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in env/.env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in env/.env.production}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in env/.env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    logging: *logging
    healthcheck:
      # Over TCP: while initialising a fresh volume the image runs a temporary
      # socket-only server, which a socket check would report as ready before
      # the migrate container can connect. $$ reads the container's own env.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: voucher-redis
    restart: unless-stopped
    # requirepass: every client must AUTH (REDIS_URL=redis://:<password>@redis:6379).
    # appendonly: persist to disk, so rate-limit windows and step-up/idempotency
    # keys survive a restart. maxmemory stays below mem_limit so Redis evicts
    # (only keys with a TTL — every key this app writes has one) instead of
    # being OOM-killed.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in env/.env.production}
      - --appendonly
      - "yes"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - volatile-lru
    environment:
      # redis-cli reads the password from here, so the healthcheck authenticates
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in env/.env.production}
    volumes:
      - redis_data:/data
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    logging: *logging
    healthcheck:
      # Unauthenticated `redis-cli ping` prints NOAUTH but still exits 0, so
      # match the reply rather than trusting the exit code.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
